name: backend-ci

# Lint (ruff) + type-check (mypy --strict) + unit tests (pytest) for the backend.
# Runs on every push / PR to the main and version-2 branches, but only when
# backend code or this workflow changes (frontend CI is a separate workflow).
on:
  push:
    branches: [main, version-2]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, version-2]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Non-secret CI placeholders for the *required* Settings fields (app.config).
    # HF_API_TOKEN / JWT_SECRET_KEY are not exercised by these tests but Settings()
    # raises without them, so alembic (env.py imports app.config) and pytest both
    # need them present. DATABASE_URL points at the `postgres` service below via
    # localhost: a GitHub Actions service container is port-mapped onto the runner
    # host, so the compose `db` hostname is NOT valid here — only localhost:5432.
    # These are throwaway values (the DB dies with the runner); never real secrets.
    env:
      HF_API_TOKEN: ci-not-a-real-token
      JWT_SECRET_KEY: ci-not-a-real-secret
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/career_coach_test

    # Postgres(+pgvector) service, matching the local docker-compose `db` service
    # (pgvector/pgvector:pg16). Without it, the ~40 live-DB integration tests
    # (test_conversation_store / test_identity_models / test_knowledge_models /
    # test_p2_exit_verification / test_structured_models / test_vector_search)
    # skip because no Postgres is reachable at DATABASE_URL; with it they execute.
    # The `options` health check gates every job step until the DB is accepting
    # connections, so no manual wait/sleep is needed. Credentials are ephemeral.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: career_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d career_coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # Fail fast on curated-dependency drift BEFORE the (slow) install/pytest
      # steps: this stdlib-only guard (no third-party imports, so it runs before
      # anything is installed) diffs backend/pyproject.toml's runtime deps against
      # the curated `uv pip install` list below + backend/Makefile, respecting a
      # documented ML/lazy-import allowlist. It names the exact missing package,
      # so a future PR that adds a new light runtime dep without curating it fails
      # here with a clear message instead of as a cryptic ModuleNotFoundError deep
      # in pytest collection (the FIX-01/02/03/04/09/11 recurring bug class).
      - name: Curated-dependency drift guard
        run: python3 scripts/check_curated_deps.py

      # Curated install: the dev tool group + only the *light* runtime libs the
      # backend currently imports (fastapi / pydantic / celery / openai / sqlalchemy).
      # A full `uv sync` would pull the heavy ML stack (torch via sentence-transformers,
      # docling) which lint / type-check / these tests never exercise — wasteful on
      # a free CI tier. Revisit (e.g. split deps into a `ml` extra) when tests start
      # importing the ML modules. `openai` is a light HTTP SDK the LLM client (P1-01)
      # imports and type-checks against; keep it here so mypy sees its real types.
      # `sqlalchemy` + `asyncpg` back the P2-01 Postgres repository (app.main imports it,
      # so every test needs it importable; asyncpg is the prod dialect the pool-config
      # test builds a non-connecting engine against). `aiosqlite` is the in-memory
      # driver the Postgres plumbing tests use instead of a live Postgres. `pgvector`
      # (the pure-Python SQLAlchemy client lib — no torch/CUDA) supplies the
      # `pgvector.sqlalchemy.Vector` column type that the P2-04/P2-06 knowledge models
      # (app/repositories/models/knowledge.py) import at module load; since almost every
      # test imports app.repositories transitively, it must be present or collection
      # errors out for the whole suite. All four are light. mypy's ignore_missing_imports
      # keeps still-un-installed libs as Any, and first-party code stays fully typed.
      # `alembic` is added here (light — pure-Python, pulls only SQLAlchemy/Mako,
      # already present) so the migration step below can run `alembic upgrade head`
      # in this curated venv via --no-sync, without triggering a full project sync
      # that would drag in the heavy ML stack. `joserfc` is the light, pure-Python JWT
      # library app/security/tokens.py signs/verifies session tokens with (a real
      # always-used runtime dep, same "light" category as sqlalchemy/asyncpg/alembic —
      # not a heavy/optional ML lib); it must be curated in so mypy sees its real return
      # types and `warn_return_any` doesn't flag `jwt.encode(...) -> Any`. `authlib` is
      # the light OIDC/PKCE client (app/security/oidc.py) SSO uses, and `langgraph` the
      # multi-agent graph lib (app/agents/graph.py) — both are real, always-imported
      # runtime deps with no heavy/ML transitives (langgraph pulls only langchain-core /
      # langgraph-* / pydantic / xxhash). They're imported at module scope by app.main /
      # app.agents, so pytest executes them at collection and needs them present or the
      # suite errors out — same "light, must-curate" category as sqlalchemy/joserfc, not
      # the deliberately-excluded ML stack (torch/sentence-transformers/docling). `reportlab`
      # is the pure-Python PDF builder (P7-02) app/pdf/builder.py uses; it's imported at
      # module scope by app/services/pdp.py → app/api/pdp.py → app.main, so pytest hits it at
      # collection for nearly every test file — another light, must-curate dep (no
      # C-extension/CUDA), not part of the excluded ML stack. Keep this
      # list in sync with the backend/Makefile `install` target (they must produce the same venv).
      - name: Install dependencies
        run: |
          uv sync --only-group dev
          uv pip install fastapi pydantic pydantic-settings "celery[redis]" openai \
            sqlalchemy asyncpg aiosqlite pgvector alembic joserfc authlib langgraph \
            python-multipart reportlab

      # --no-sync: run the tool in the curated venv above WITHOUT uv re-resolving
      # and installing the full project dependency tree (which would drag in the
      # heavy ML/CUDA stack). The env was prepared explicitly in the step above.
      - name: Lint (ruff check)
        run: uv run --no-sync ruff check .

      - name: Format check (ruff format --check)
        run: uv run --no-sync ruff format --check .

      - name: Type-check (mypy --strict)
        # Include migrations/ so the Alembic env.py (which imports app.*) is
        # type-checked too. The heavy ML libs still excluded from the curated
        # install (docling, sentence-transformers/torch) stay Any via mypy's
        # ignore_missing_imports; langgraph is now installed (light, no ML
        # transitives) so pytest can execute app/agents/graph.py at collection.
        run: uv run --no-sync mypy app/ migrations/

      # The pgvector `vector` extension is normally enabled by the P0-07 init
      # script (migrations/init/01_enable_pgvector.sql), which docker-compose mounts
      # into the container's /docker-entrypoint-initdb.d. A GitHub Actions service
      # container starts BEFORE the repo is checked out, so it can't mount that file
      # — instead we feed the exact same script to the service's own psql via
      # `docker exec` (no host-psql-version assumption). Migration 0003 assumes the
      # extension already exists, so this must run before `alembic upgrade head`.
      - name: Enable pgvector extension
        run: |
          docker exec -i "${{ job.services.postgres.id }}" \
            psql -U postgres -d career_coach_test \
            < migrations/init/01_enable_pgvector.sql

      # Apply Alembic migrations to the CI Postgres before the tests run. Migrations
      # are always an explicit, separate step (never auto-run in the app lifespan) —
      # same posture as `make migrate`. alembic reads DATABASE_URL from
      # app.config.Settings (job-level env above); --no-sync reuses the curated venv.
      - name: Run migrations (alembic upgrade head)
        run: uv run --no-sync alembic upgrade head

      # With the service + migrations in place, DATABASE_URL now points at a live,
      # migrated Postgres — so the previously-skipped integration modules execute
      # (net +40 tests running) instead of skipping.
      - name: Test (pytest)
        run: uv run --no-sync pytest
