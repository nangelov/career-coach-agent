[project]
name = "career-coach-agent"
version = "2.0.0"
description = "AI career-coaching assistant — v2 backend"
requires-python = ">=3.11"
dependencies = [
    # Core framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # Multipart form parsing — required by FastAPI for file uploads (POST /api/profile/cv).
    "python-multipart>=0.0.9",
    # Settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # DB / cache
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "pgvector>=0.2.0",
    # Auth
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    # LLM / embeddings
    "openai>=2.0.0",
    "sentence-transformers>=3.0.0",
    # Input jailbreak/prompt-injection classifier (S8, §7.4): in-process HF Prompt-Guard model.
    # Heavy ML stack (needs torch, already pulled by sentence-transformers); lazily imported by
    # app/guardrails/injection_classifier.py, so excluded from the curated CI venv (allowlisted
    # in scripts/check_curated_deps.py), same as sentence-transformers.
    "transformers>=4.40.0",
    "langgraph>=0.1.0",
    "langmem>=0.0.1",
    # Background jobs
    "celery[redis]>=5.3.0",
    # Document ingestion
    "docling>=2.0.0",
    "Pillow>=10.0.0",
    # OCR fallback (scanned/image CVs). pytesseract needs the system `tesseract` binary;
    # ocrmypdf needs Ghostscript + qpdf — install those in the Docker/dev image (apt:
    # `tesseract-ocr ghostscript qpdf`). Imported lazily in app/ingestion/ocr_parser.py, so
    # they are excluded from the curated CI venv (like docling's ML stack) and their tests
    # skip where the toolchain is absent.
    "pytesseract>=0.3.10",
    "ocrmypdf>=15.0.0",
    # PDF output
    "reportlab>=4.0.0",
    # Web / search
    "google-search-results>=2.4.0",
    # Observability — OpenTelemetry tracing (P11, §7.8). api + sdk are light pure-Python and
    # imported at module scope (app/observability/tracing.py), so they are in the curated CI
    # install. The FastAPI/Celery instrumentation and the OTLP/HTTP exporter are imported
    # lazily (only when OTEL_ENABLED / an endpoint is set), so they are on the
    # INTENTIONAL_EXCLUSIONS allowlist in scripts/check_curated_deps.py rather than curated.
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.40b0",
    "opentelemetry-instrumentation-celery>=0.40b0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    # Error tracking — Sentry free tier (P11, §6.24 / §7.7). Light pure-Python SDK (urllib3 +
    # certifi only; the FastAPI/Celery integrations ship inside it, no extra package). Imported
    # (guarded) at module scope in app/observability/sentry.py, so it is in the curated CI
    # install (a no-op unless SENTRY_DSN is configured).
    "sentry-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio[trio]>=4.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    # Type stubs for Celery (ships no py.typed) so strict mypy can type the
    # @celery_app.task decorators in app/tasks/* without per-module opt-outs.
    "celery-types>=0.22.0",
]

[tool.uv]
# This is an application (not a distributable library); uv manages the lockfile.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
# Runtime floor is 3.11 (requires-python = ">=3.11", Dockerfile python:3.11-slim).
# Keep mypy aligned with the runtime rather than 3.12 so checks match production.
python_version = "3.11"
# Heavy ML libs deliberately excluded from the curated CI venv (e.g. docling,
# sentence-transformers, torch) resolve to Any there instead of failing the build.
# First-party code stays fully typed. (langgraph IS installed in CI, so its real
# types apply.)
ignore_missing_imports = true
# pydantic v2 mypy plugin: teaches mypy that BaseSettings/BaseModel fields with
# env defaults are not required constructor args (fixes Settings() call-arg).
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
