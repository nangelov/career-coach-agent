# Alembic configuration for the Career Coach Agent v2 backend.
#
# Placement: this file lives at `backend/alembic.ini`, so `backend/` is the natural
# working directory for `alembic ...` in dev and CI (that is also where `app/` is
# importable from — `prepend_sys_path = .` below puts `backend/` on sys.path so
# `migrations/env.py` can `import app`).
#
# The database URL is intentionally NOT set here. `migrations/env.py` reads
# `DATABASE_URL` from `app.config.Settings` (the same settings object the app uses)
# so Alembic and the running app can never drift on connection config. See env.py.

[alembic]
# Path to the migration environment (env.py, script.py.mako, versions/), relative
# to the %(here)s token (the directory containing this ini file, i.e. backend/).
script_location = %(here)s/migrations

# Migration filenames: <rev>_<slug>.py. Prepending a UTC date keeps them ordered
# on disk in the same order they are applied, which is easier to scan in review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Split list-valued options (prepend_sys_path, version_locations) on os.pathsep.
path_separator = os

# Prepend backend/ to sys.path so `import app` resolves inside env.py.
prepend_sys_path = .

# NOTE: `sqlalchemy.url` is deliberately omitted — env.py injects it from
# app.config.Settings.DATABASE_URL at runtime (single source of truth).

# Logging configuration (consumed by env.py via fileConfig).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
