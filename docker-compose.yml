# Local development stack for Career Coach Agent v2.
#
# Five services: Postgres(pgvector) + Redis (self-hosted datastores, locked
# decision — no Mongo, no managed tier), the FastAPI backend, a Celery worker
# (same image as the backend), and the Next.js frontend.
#
# All credentials come from a local `.env` file (see `.env.example`); nothing
# secret is hard-coded here. Copy `.env.example` to `.env` and fill it in.
#
# Port lockdown (design §7.2 / §6.12): the Next.js `frontend` (:3000) is the ONLY
# published host port — the UI is the only entry point and the backend is not a
# public API. `db`, `redis` and `backend` publish NO host ports; they reach each
# other only over the internal Docker network by service name. To expose them on
# the host for local debugging (DB client on :5432, curl the backend on :8000),
# opt in explicitly with the override file:
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No host port published (internal Docker network only — see header note).
    # Opt in via docker-compose.dev-ports.yml to reach it on localhost:5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run by the Postgres entrypoint on first cluster init only
      # (empty data volume). Enables the pgvector `vector` extension — see
      # backend/migrations/init/01_enable_pgvector.sql.
      - ./backend/migrations/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Enable append-only persistence so the named volume actually retains data.
    command: ["redis-server", "--appendonly", "yes"]
    # No host port published (internal Docker network only — see header note).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    # Pull non-secret model/app config from .env, then override the datastore
    # URLs to point at the in-network service hostnames (db / redis).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    # No host port published — the backend is not a public API (design §7.2).
    # The healthcheck curls localhost:8000 *inside* the container, so it keeps
    # working with no published port. Opt in via docker-compose.dev-ports.yml
    # to hit it on localhost:8000 during development.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    # Same image as the backend; only the command differs.
    build:
      context: ./backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    # Same image as the backend; runs the Celery beat scheduler that fires the
    # periodic retention-purge task (S14, §6.18) — the daily beat_schedule entry in
    # app/tasks/celery_app.py. Beat only *enqueues* on schedule; the ``worker`` above
    # executes the enqueued task, so both services are needed for the sweep to run.
    build:
      context: ./backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    # The Next.js BFF Route Handlers (app/api/*) forward same-origin /api/* calls to
    # the backend with the session Authorization header injected server-side from the
    # httpOnly cookie (SEC-04 — see frontend/lib/apiProxy.ts + lib/bffProxy.ts). Unlike
    # the old build-frozen rewrites(), the handlers read INTERNAL_API_URL at REQUEST time
    # (Node runtime), so it is a runtime `environment:` entry (no build ARG needed): the
    # in-network compose service name `backend`, reachable only from the frontend
    # container's Node process. The browser only ever talks to :3000 (same-origin, no CORS).
    environment:
      INTERNAL_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
